<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0" />
        <link rel="icon" href="{% static 'images/favicon.png' %}">
        <title>Login | AH Hospital</title>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

        <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}" />

        <link rel="stylesheet" href="{% static 'plugins/fontawesome/css/fontawesome.min.css' %}" />
        <link rel="stylesheet" href="{% static 'plugins/fontawesome/css/all.min.css' %}" />

        <link rel="stylesheet" type="text/css" href="{% static 'css/select2.min.css' %}" />

        <link rel="stylesheet" href="{% static 'plugins/datatables/datatables.min.css' %}" />

        <link rel="stylesheet" href="{% static 'css/feather.css' %}" />

        <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}" />

            
    </head>
    <body>

        <div class="main-wrapper login-body">
            <div class="container-fluid px-0">
                <div class="row">
                    <div class="col-lg-6 login-wrap">
                        <div class="login-sec">
                            <div class="log-img">
                                <img class="img-fluid" src="{% static 'img/login-02.png' %}" alt="Logo" />
                            </div>
                        </div>
                    </div>
        
                    <div class="col-lg-6 login-wrap-bg">
                        <div class="login-wrapper">
                            <div class="loginbox">
                                <div class="login-right">
                                    <div class="login-right-wrap">
                                        <div class="account-logo">
                                            <a href="#"><img style="width: 220px" src="{% static 'img/logo.png' %}" alt /></a>
                                        </div>
                                        <h2>Login</h2>
        
                                        <form method="post" enctype="multipart/form-data">
                                            {% csrf_token %}
                                            <div class="input-block">
                                                <label>Username <span class="login-danger">*</span></label>
                                                <input name="username" required class="form-control" type="text" />
                                            </div>
                                            <div class="input-block">
                                                <label>Password <span class="login-danger">*</span></label>
                                                <input class="form-control pass-input" type="password" name="password" required />
                                                <span class="profile-views feather-eye-off toggle-password"></span>
                                            </div>
                                            <div class="forgotpass">
                                                <div class="remember-me">
                                                    <label class="custom_check mr-2 mb-0 d-inline-flex remember-me">
                                                        Remember me
                                                        <input type="checkbox" name="radio" />
                                                        <span class="checkmark"></span>
                                                    </label>
                                                </div>
                                            </div>
                                            <div class="input-block login-btn">
                                                <button class="btn btn-primary btn-block" type="submit">Login</button>
                                            </div>
                                        </form>
        
       
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar-overlay" data-reff></div>

        <script src="{% static 'js/jquery-3.7.1.min.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>

        <script src="{% static 'js/bootstrap.bundle.min.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>

        <script src="{% static 'js/feather.min.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>

        <script src="{% static 'js/jquery.slimscroll.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>

        <script src="{% static 'js/select2.min.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>

        <script src="{% static 'plugins/datatables/jquery.dataTables.min.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>
        <script src="{% static 'plugins/datatables/datatables.min.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>

        <script src="{% static 'js/jquery.waypoints.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>
        <script src="{% static 'js/jquery.counterup.min.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>

        <script src="{% static 'plugins/apexchart/apexcharts.min.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>
        <script src="{% static 'plugins/apexchart/chart-data.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>

        <script src="{% static 'js/app.js' %}" type="0809f830a9a7270f0d91c883-text/javascript"></script>

        <script src="{% static 'cdn-cgi/scripts/7d0fa10a/cloudflare-static/rocket-loader.min.js' %}" data-cf-settings="0809f830a9a7270f0d91c883-|49" defer></script></body>


        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        
        <!-- Include the SweetAlert script -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                {% if messages %}
                    {% for message in messages %}
                        Swal.fire({
                            title: "{{ message.tags|capfirst }}",
                            text: "{{ message }}",
                            icon: "{{ message.tags }}",
                            confirmButtonText: "OK"
                        });
                    {% endfor %}
                {% endif %}
            });
        </script>

                    
    </body>

</html>
