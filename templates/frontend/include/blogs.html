{% load static %}
<!-- rts blog area start -->
<div class="mt--50 rts-blog-area rts-section-gap">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="title-between-area">
                    <div class="title-wrapper-left">
                        <h2 class="title">
                            Latest Trends & Insights in the Medical World 
                        </h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-5 mt--20">

          
          {% for x in blogs %}                
              <div class="col-lg-4 col-md-6 col-sm-12 col-12 wow fadeInUp" data-wow-delay=".2s" data-wow-duration=".8s">
                  <!-- single blog areas start -->
                  <div class="rts-single-blog">
                      <a href="#" class="thumbnail">
                          <img src="{{x.image.url}}" alt="blog-image">
                      </a>
                      <div class="inner-content">
                          <div class="author-area">
                              <span class="name">{{x.category}}</span>
                              <span>{{ x.createdAt|date:"d F Y" }}</span>
                          </div>
                          <a class="button-wrapper" href="#">
                              <h5 class="title">
                                  {{x.heading}}
                              </h5>
                          </a>
                          <a href="{% url 'single_blog' x.slug %}" class="rts-btn btn-primary border bg-transparent">Read More <img src="assets/images/banner/icons/arrow--up-right.svg" alt=""></a>
                      </div>
                  </div>
                  <!-- single blog areas end -->
              </div>
          {% endfor %}
              

        </div>
    </div>
</div>
<!-- rts blog area end -->
